<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive a train</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Drive a train</h1>
        <p id="status" class="status">Connecting…</p>
    </header>

    <main id="panel" hidden>
        <div class="layout">
            <div class="controls">
                <section>
                    <h2>Choose your train</h2>
                    <div id="locos" class="row"></div>
                    <p id="where" class="where"></p>
                </section>

                <section>
                    <h2>Speed</h2>
                    <!-- Changed to a vertical flex column for the throttle layout -->
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 15px;">
                        
                        <!-- Speed readout at the top -->
                        <div style="font-size: 1.5rem; font-weight: bold; color: #333;">
                            <span id="speedValue">0</span>%
                        </div>

                        <!-- Vertical slider (throttle) -->
                        <input type="range" id="speedSlider" min="0" max="100" value="0" orient="vertical" 
                               style="appearance: slider-vertical; -webkit-appearance: slider-vertical; width: 50px; height: 220px; margin: 0; cursor: pointer;">
                        
                        <!-- Stop button acts as the base of the throttle -->
                        <button id="stop" class="stop" style="width: 100%; padding: 12px; font-weight: bold;">Stop train</button>
                    </div>
                </section>

                <section>
                    <h2>Direction</h2>
                    <div class="row">
                        <button data-dir="forward" class="dir">Forward</button>
                        <button data-dir="reverse" class="dir">Reverse</button>
                    </div>
                    <p class="hint">Changing direction stops the train first.</p>
                </section>

                <section id="switchSection">
                    <h2>Track switches</h2>
                    <div id="switches" class="row"></div>
                    <p class="hint">Tap a switch to send trains the other way.</p>
                </section>
            </div>

            <section class="mapbox">
                <h2>Track map</h2>
                <p class="hint">Tap a train to pick it. Tap a switch to flip it.</p>
                <svg id="map" role="img" aria-label="Track map"></svg>
            </section>
        </div>
    </main>

    <div id="toast" role="status"></div>
    <button id="estop" class="estop">Emergency stop</button>

    <script src="/static/map.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
